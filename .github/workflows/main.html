<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mind Maze 2.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameScreen">
    <div id="lockContainer" class="hidden">
      <button type="button" id="coordinatorBtn" aria-label="Coordinator Unlock">🔒</button>
    </div>

    <h1>HACKOVERSE</h1>
    <h2 class="subtitle">Mind Maze 2.0</h2>
    <h3 id="playerDisplay"></h3>

    <div class="stats-bar">
      <div>Time Left: <span id="timer">03:30</span></div>
      <div>Solved: <span id="solvedCount">0/9</span></div>
    </div>

    <pre id="codeProblem"></pre>

    <textarea
      id="participantCode"
      placeholder="Type your solution here"
      spellcheck="false"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
    ></textarea>

    <button type="button" id="runBtn">Run</button>

    <div id="outputBox" class="hidden">
      <h4>Output:</h4>
      <pre id="outputDisplay"></pre>
    </div>
  </div>

  <div id="endScreen" class="hidden">
    <h1>HACKOVERSE</h1>
    <h2 class="subtitle">Mind Maze 2.0</h2>
    <h2 id="endMessage"></h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
